[databases]
postgres = host=localhost port=5432 dbname=postgres
pgbench_test = host=localhost port=5432 dbname=pgbench_test
benchmark = host=localhost port=5432 dbname=benchmark

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 9997
auth_type = trust
auth_file = /Users/pgedge/pge/ibrar-lab/cluster-managment/benchmark/conf/userlist.txt
admin_users = pgedge
stats_users = pgedge
pool_mode = transaction
server_reset_query = DISCARD ALL
max_client_conn = 100
default_pool_size = 20
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
pidfile = /tmp/pgbouncer.pid
logfile = /Users/pgedge/pge/ibrar-lab/cluster-managment/cluster/log/pgbouncer.log
