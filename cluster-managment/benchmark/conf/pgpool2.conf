# pgpool2 configuration for benchmark
listen_addresses = 'localhost'
port = 9999
socket_dir = '/tmp'
pcp_port = 9898
pcp_socket_dir = '/tmp'
pid_file_name = '/tmp/pgpool.pid'
logdir = '/tmp'

# Connection settings (reduced for macOS shared memory limits)
num_init_children = 4
max_connections = 100
child_life_time = 300
child_max_connections = 0
connection_life_time = 0
client_idle_limit = 0

# Backend settings - Primary + 2 Replicas
backend_hostname0 = 'localhost'
backend_port0 = 5432
backend_weight0 = 1
backend_data_directory0 = '/Users/pgedge/pgdata/primary'
backend_flag0 = 'ALLOW_TO_FAILOVER'

backend_hostname1 = 'localhost'
backend_port1 = 5433
backend_weight1 = 1
backend_data_directory1 = '/Users/pgedge/pgdata/replica1'
backend_flag1 = 'ALLOW_TO_FAILOVER'

backend_hostname2 = 'localhost'
backend_port2 = 5434
backend_weight2 = 1
backend_data_directory2 = '/Users/pgedge/pgdata/replica2'
backend_flag2 = 'ALLOW_TO_FAILOVER'

# Authentication
authentication_timeout = 60
ssl = off

# Logging
log_destination = 'stderr'
log_directory = '/Users/pgedge/pge/ibrar-lab/cluster-managment/cluster/log'
log_filename = 'pgpool2.log'
log_min_messages = 'notice'
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,client=%h '

# Health check (disabled for benchmark)
health_check_period = 0
health_check_timeout = 20
health_check_user = 'pgedge'
health_check_password = ''
health_check_database = 'postgres'

# Failover
failover_on_backend_error = true
failover_command = ''

# Load balancing (disabled - pgbench has writes which fail on read-only replicas)
load_balance_mode = off
ignore_leading_white_space = true

# Streaming replication check (required for load balancing)
sr_check_period = 0
sr_check_user = 'pgedge'
sr_check_password = ''
sr_check_database = 'postgres'

# Backend clustering mode
backend_clustering_mode = 'streaming_replication'

# Connection pooling
connection_cache = true
reset_query_list = 'ABORT; DISCARD ALL'

# Memory/Query cache (disabled for macOS)
memory_cache_enabled = off
