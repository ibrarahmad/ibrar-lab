# pgbouncer configuration for benchmark

[databases]
postgres = host=localhost port=5432 dbname=postgres
benchmark = host=localhost port=5432 dbname=benchmark

[pgbouncer]
listen_addr = localhost
listen_port = 9997
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
logfile = /home/pgedge/pge/pgbalancer/benchmark/log/pgbouncer.log
pidfile = /tmp/pgbouncer.pid
admin_users = postgres
stats_users = postgres

# Pool settings
pool_mode = session
default_pool_size = 20
max_client_conn = 100
max_db_connections = 0
max_user_connections = 0

# Connection settings
server_reset_query = DISCARD ALL
server_check_query = SELECT 1
server_check_delay = 30

# Timeouts
server_connect_timeout = 15
server_login_retry = 15
client_login_timeout = 60
query_timeout = 0
query_wait_timeout = 120
client_idle_timeout = 0
# client_idle_transaction_timeout = 0  # Not supported in this version

# Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
verbose = 0
