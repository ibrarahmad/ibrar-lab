# pgpool2 configuration for benchmark
listen_addresses = 'localhost'
port = 9999
socket_dir = '/tmp'
pcp_port = 9898
pcp_socket_dir = '/tmp'

# Connection settings
num_init_children = 32
max_connections = 100
child_life_time = 300
child_max_connections = 0
connection_life_time = 0
client_idle_limit = 0

# Authentication
authentication_timeout = 60
ssl = off
enable_pool_hba = off
pool_passwd = '/home/pgedge/pge/pgbalancer/benchmark/conf/pool_passwd'

# Logging
log_destination = 'stderr'
log_directory = '/home/pgedge/pge/pgbalancer/benchmark/log'
log_filename = 'pgpool2.log'
log_min_messages = 'notice'
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,client=%h '

# Health check
health_check_period = 30
health_check_timeout = 20
health_check_user = 'postgres'
health_check_password = ''
health_check_database = 'postgres'
health_check_max_retries = 3
health_check_retry_delay = 1

# Failover
failover_on_backend_error = true
failover_command = ''

# Load balancing
load_balance_mode = on
ignore_leading_white_space = true

# Connection pooling
connection_cache = true
reset_query_list = 'ABORT; DISCARD ALL'

# Backend settings

backend_hostname0 = 'localhost'
backend_port0 = 5432
backend_weight0 = 1
backend_data_directory0 = '/var/lib/pgsql/data'
backend_flag0 = 'ALLOW_TO_FAILOVER'

# Only primary backend configured
