# PostgreSQL configuration for benchmark

# Connection settings
listen_addresses = 'localhost'
port = 5432
max_connections = 500
superuser_reserved_connections = 3

# Memory settings - Optimized for benchmark
shared_buffers = 1GB
effective_cache_size = 4GB
work_mem = 16MB
maintenance_work_mem = 256MB

# Checkpoint settings - Optimized for benchmark
checkpoint_completion_target = 0.9
wal_buffers = 64MB
checkpoint_timeout = 30min
max_wal_size = 4GB
min_wal_size = 512MB

# Query planner - Optimized for SSD
random_page_cost = 1.0
effective_io_concurrency = 300

# Logging - Minimal for benchmark performance
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 0
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,client=%h '
log_checkpoints = off
log_connections = off
log_disconnections = off
log_lock_waits = off

# Statistics - Minimal for performance
track_activities = off
track_counts = off
track_io_timing = off
track_functions = none
stats_temp_directory = '/tmp'

# Autovacuum - Optimized for benchmark
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s

# Lock management
deadlock_timeout = 1s
lock_timeout = 0

# Background writer - Optimized for benchmark
bgwriter_delay = 100ms
bgwriter_lru_maxpages = 200
bgwriter_lru_multiplier = 3.0

# WAL settings
wal_level = replica
max_wal_senders = 3
max_replication_slots = 3

# Archive settings
archive_mode = off

# Performance - Optimized for benchmark
synchronous_commit = on
fsync = on
full_page_writes = on
